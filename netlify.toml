# https://docs.netlify.com/configure-builds/overview/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Contact form → Web3Forms via serverless (see VITE_CONTACT_SUBMIT_URL in .env.example)
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true
